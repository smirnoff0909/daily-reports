services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-reports}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reports}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # только loopback: наружу сайт отдаёт фронтовой веб-сервер этого хоста
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reports}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reports}
      SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"

volumes:
  db-data:
