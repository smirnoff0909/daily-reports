<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ static_version }}">
</head>
<body class="{% if user %}signed{% else %}anon{% endif %}">
{% if user %}
<header class="topbar">
  <a class="brand" href="/">{{ app_name }}</a>
  <nav class="nav">
    {% if user.is_manager %}
    <a class="{% if request.url.path == '/reports' %}here{% endif %}" href="/reports">Сводный по отделу</a>
    <a class="{% if request.url.path.startswith('/staff') %}here{% endif %}" href="/staff">Сотрудники</a>
    {% else %}
    <a class="{% if request.url.path == '/reports/new' %}here{% endif %}" href="/reports/new">Сегодня</a>
    <a class="{% if request.url.path == '/reports/my' %}here{% endif %}" href="/reports/my">Мой месяц</a>
    {% endif %}
  </nav>
  <a class="who {% if request.url.path == '/profile' %}here{% endif %}"
     href="/profile" title="Личный кабинет">{{ user.full_name }}</a>
</header>
{% endif %}
<main class="page">
  {% block content %}{% endblock %}
</main>
</body>
</html>
